services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant-main
    ports:
      - "${QDRANT_PORT}:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
  postgres_db:
    container_name: postgres-main
    image: postgres
    env_file: .env
    expose:
      - "5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/18/docker